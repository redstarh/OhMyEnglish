[project]
name = "ohmyenglish-backend"
version = "0.1.0"
description = "OhMyEnglish backend — voice-based English learning app (first vertical slice)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "aws-sdk-bedrock-runtime>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
# ⛔ **통합테스트 에이전트가 남긴 회차 증거만 검사 밖에 둔다** (`TASK-247` · 2026-09-19).
# 그 폴더의 `.py` 는 판정에 쓰인 드라이버의 **사본**이고, 서식을 맞추려 사후에 고치면 판정 근거가
# 바뀐다 — 증거의 무결성이 서식보다 세다. 실제로 회차 하나가 15건 위반으로 게이트를 깼다.
# ⛔ **`tests/harness/runs/**` 는 넣지 않는다** — 사람이 손으로 쓴 드라이버라 지금 제외 없이
# 통과하고 있고, 여기에 넣어 넓히면 「증거도 린트를 지킨다」는 관례가 조용히 죽는다.
extend-exclude = ["../../tests/agent/runs"]

[tool.ruff.lint]
# ⛔ **아래 여섯은 「코드를 고치지 않고 켠」 것이다** (`TASK-144.1` · 2026-09-17 정리 회차).
# 켜기 전에 각각 위반 수를 세서 **전부 0건**임을 확인했다 — 즉 이 줄은 지금 코드를 바꾸지 않고
# **다음 사람이 같은 실수를 하는 것만** 막는다.
# ⚠️ **그룹 전체가 아니라 규칙을 고른 자리가 둘 있다**: `S` 그룹 전체는 위반 17건이고 `N` 그룹은
# 2건이라, 위반 0인 `S310`·`N803` 만 켰다. 그 둘을 그룹으로 넓히려면 먼저 그 17건·2건을 손봐야 한다.
# ⚠️ `BLE` 를 켜면서 **죽어 있던 `# noqa: BLE001` 6건이 살아났다** — 그 표식은 근거를 담고 있으므로
# 지우지 않았다. 이 관계가 뒤집히면(규칙을 다시 끄면) 그 표식이 다시 아무 일도 하지 않게 된다.
#
# ⛔ **뒤의 다섯(`C4`·`LOG`·`PIE`·`TID`·`RSE`)도 「코드를 고치지 않고 켠」 것이다**
# (`TASK-222` · 2026-09-19 정리 회차). 다만 위 여섯과 **다른 점이 하나 있다**: 이번에는 켜기 전에
# **세 트리를 다 재서** `app`·`tests`·`scripts` 전부 0건임을 확인했다 ⇒ **아래 per-file-ignores 에
# 넣지 않는다.** 위 여섯이 앱으로 좁혀진 이유(그쪽 트리의 의도를 위반으로 바꾼다)가 이 다섯에는
# 없다는 것이 측정된 사실이다.
# ⚠️ **켜지 않기로 한 것도 적어 둔다** — 「0건이 아니어서 못 켰다」와 「세어 보니 켜면 안 되더라」는
# 다르고, 뒤쪽은 다음 사람이 다시 세지 않게 근거가 남아야 한다:
#   · `ARG` (4건) — 넷 다 `audio_gateway/stub.py` 의 **포트 구현**이다. 인터페이스를 이행하려면
#     쓰지 않는 인자를 받아야 하므로 그 4건은 정상 코드다. 켜면 옳은 코드를 위반으로 만든다.
#   · `ISC` (2건) — 둘 다 100열 상한에 맞추려고 **일부러 줄바꿈한 f-string** 이다(`nova.py` ·
#     `services/plan.py`). 켜면 괄호를 강제해 잡음만 늘어난다.
#   · `TRY`(59) · `EM`(59) · `PL`(23) · `RUF`(18) · `ANN`(10) — 건수가 커서 이번 범위 밖이다.
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
    "PTH",
    "SLF",
    "S310",
    "N803",
    "C4",
    "LOG",
    "PIE",
    "TID",
    "RSE",
]

# ⛔ **새로 켠 여섯은 «앱 트리에만» 적용한다** (`TASK-144.1` 정정 · 2026-09-17).
# 켤 때 `app/backend` 만 재고 **`tests`·`scripts` 트리를 재지 않은 것이 내 실수였다** — 그쪽에서
# 세어 보니 **27건**이 나왔고 그중 다수가 «일부러 그렇게 쓴 것»이다:
#   · `DTZ001` — naive datetime 을 **거부하는지 재는** 테스트가 일부러 naive 값을 만든다.
#   · `BLE001` — 하네스 드라이버가 진단을 살리려고 넓게 잡는다(실패해도 증거를 남기는 것이 목적).
#   · `SLF001` — 사설 SQL 상수를 읽는 tripwire 테스트가 의도적으로 내부를 본다.
# ⇒ 그 트리에 규칙을 강제하면 **의도를 위반으로 바꾼다.** 그래서 범위를 앱으로 좁혔다.
# ⚠️ `E`·`F`·`I`·`UP`·`B` 는 그대로 두 트리 모두에 적용된다(이전부터 그랬다 — `H-L`·`H-BN`).
[tool.ruff.lint.per-file-ignores]
"../../tests/**" = ["BLE", "DTZ", "PTH", "SLF", "S310", "N803"]
"../../scripts/**" = ["BLE", "DTZ", "PTH", "SLF", "S310", "N803"]
