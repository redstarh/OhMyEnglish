# ty 검사 스코프 — `ty check`(인자 없음) 한 번으로 백엔드 소스와 테스트를 모두 덮는다.
#
# 왜 `app/backend/pyproject.toml`의 `[tool.ty]`가 아닌가: `src.include`는 프로젝트
# 루트 밖(`../../tests`)을 가리킬 수 없다("The parent directory operator (`..`) is
# not allowed"). 그래서 설정을 리포지토리 루트로 올려 프로젝트 루트 자체를 넓힌다.
# ty는 cwd에서 위로 올라가며 이 파일을 찾으므로 `app/backend`에서 실행해도 적용된다.
#
# ⚠️ `app/backend/pyproject.toml`에 `[tool.ty]` 섹션을 추가하지 마라 — 설정 탐색이
# 거기서 멈춰 tests/가 조용히 검사 대상에서 빠진다.
#
# ⛔ **아래 `[src] include` 가 `tests` 를 담는다 — `tests/` 아래 새 파일도 게이트 대상이다.**
# 그래서 `tests/harness/*.py` 를 하나 추가하면 `ty check` 를 **다시 재야 한다.** 2026-09-09 에
# 이 사실을 모르고 새 하네스 실행체를 넣어 두 커밋(`7bbc415`·`057ceef`) 동안 게이트가 진단 4건으로
# 깨진 채였고, 그 태스크를 `Done` 으로 닫을 때 `ty check` 를 재지 않은 것이 누락의 원인이었다.
# 다른 세션의 테스트 회차가 찾아 알렸다.
# ⚠️ **`pytest` 만 통과했다고 `ty` 가 통과한 것이 아니다** — `pytest` 는 `test_*.py` 만 수집하지만
# `ty` 는 `tests/` 아래 **모든** `.py` 를 본다. 실행체(`c1_*.py`·`c5_*.py`)가 정확히 그 틈에 있다.
# 함정 등록: `docs/ops/pitfalls.md` 의 **H-AV**.

[environment]
python = "app/backend/.venv"
# 첫 파티 모듈 해석 경로. `app.*`는 app/backend 기준, 테스트는 리포 루트 기준이다.
# `scripts`는 `tests/conftest.py`가 `from db_utils import ...`로 정적 참조하는
# `scripts/db_utils.py`를 해석하기 위한 루트다 — 런타임에는 conftest.py가 직접
# sys.path에 넣지만, ty는 코드를 실행하지 않으므로 이 설정 없이는 해석하지 못한다.
root = ["app/backend", ".", "scripts"]

[src]
include = ["app/backend/app", "tests"]
