<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OhMyEnglish — Practice</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="screen screen--practice">
  <main class="practice-card">
    <div class="practice-head">
      <div>
        <p class="label">Today's practice</p>
        <p class="practice-day">Day 1 · Units 1–21</p>
      </div>
      <button type="button" class="btn">← Close</button>
    </div>

    <p class="unit-name">Unit 15 · used to</p>
    <div class="practice-controls">
      <span class="toggle-group">
        <button type="button" class="toggle" aria-pressed="false" aria-label="Show Korean translation" title="Show Korean translation">KO</button>
      </span>
      <span class="toggle-group" role="group" aria-label="Mode">
        <button type="button" class="toggle" aria-pressed="true">Auto</button>
        <button type="button" class="toggle" aria-pressed="false">Manual</button>
      </span>
    </div>

    <section class="sentence-panel" aria-label="Sentence">
      <div class="sentence-meta">
        <span>Sentence 3 / 5 · <span class="phase">③ Check</span></span>
        <span>Try 1</span>
      </div>
      <div class="listen-bar"></div>
      <p class="sentence">We used to deploy by hand.</p>
      <div class="result-slot">
        <div class="spoken">
          <span class="spoken-label">You said: </span>We used to deploy by hand.
          <p class="result-line">All words matched</p>
        </div>
      </div>
    </section>

    <nav class="practice-nav" aria-label="Sentences">
      <button type="button" class="btn">← Previous</button>
      <button type="button" class="btn">Try again</button>
      <button type="button" class="btn btn--primary">Next →</button>
    </nav>
  </main>
</body>
</html>
