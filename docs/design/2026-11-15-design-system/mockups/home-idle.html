<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OhMyEnglish — Home</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="screen">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      </span>
      <div>
        <p class="brand-name">OhMyEnglish</p>
        <p class="brand-tag">SPEAK. REMEMBER. GROW.</p>
      </div>
    </div>
    <button type="button" class="icon-button" aria-label="Your progress" title="Your progress">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    </button>
  </header>

  <p class="summary">0 / 6 days · This week 0 / 7</p>

  <main class="hero-card">
    <div>
      <p class="label label--on-dark">Today's practice</p>
      <h1 class="hero-title">Day 1: listen and say it.</h1>
      <p class="hero-desc">Hear a short sentence. Say it out loud. See what you said.</p>
    </div>
    <div class="hero-start">
      <button type="button" class="btn-start">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Start speaking
      </button>
      <p class="hero-day">Day 1 · Units 1–21</p>
    </div>
  </main>
</body>
</html>
